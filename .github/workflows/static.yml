name: Deploy static content to Pages

# Rebuilds static/ from source (frontend bundle + data snapshot from the real backend)
# and publishes it to GitHub Pages: https://thirumald.github.io/precast/
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "tools/static/**"
      - "static/**"
      - ".github/workflows/static.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress production deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd frontend && npm ci --no-audit --no-fund && cd ..
          pip install -r backend/requirements.txt

      - name: Backend tests
        run: pip install pytest && cd backend && pytest -q

      - name: Build static bundle
        run: cd frontend && npm run build:static

      - name: Build snapshot, downloads and pages
        env:
          PRECAST_LLM_ENABLED: "0"   # deterministic template output; no model in CI
        run: python tools/static/build_static.py

      - name: Check output
        run: |
          set -e
          test -f static/index.html
          test -f static/assets/precast.js
          test -f static/data/snapshot.js
          n=$(ls static/*.html | wc -l)
          echo "pages: $n"
          [ "$n" -ge 23 ]
          du -sh static

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
